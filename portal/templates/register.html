{% extends "base.html" %}
{% block title %}{{ t('register') }} · {{ catalog_title }}{% endblock %}
{% block main %}
<h1>{{ t('register') }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/register" class="form">
  <input type="hidden" name="stamp" value="{{ stamp }}">
  <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
  <div><label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" autocomplete="email" required></div>
  <div><label for="name">{{ t('name') }}</label><input id="name" name="name" autocomplete="name" required></div>
  <div><label for="organisation">{{ t('organisation') }}</label><input id="organisation" name="organisation" autocomplete="organization"></div>
  <div><label for="password">{{ t('password') }}</label><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="pw-rule"><p id="pw-rule" class="hint">{{ rule }}</p></div>
  <div class="check"><input id="accept_terms" name="accept_terms" type="checkbox" value="1" required><label for="accept_terms">{{ t('accept_terms') }}</label></div>
  <button type="submit">{{ t('register') }}</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('login') }} · {{ catalog_title }}{% endblock %}
{% block main %}
<h1>{{ t('login') }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="form">
  <div><label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" autocomplete="username" required></div>
  <div><label for="password">{{ t('password') }}</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <div><label for="totp">{{ t('totp') }}</label><input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code"></div>
  <button type="submit">{{ t('login') }}</button>
</form>
{% endblock %}
